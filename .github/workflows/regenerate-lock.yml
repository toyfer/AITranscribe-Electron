name: Regenerate package-lock.json

# Phase 3 後など、package.json のピンに合わせて lock だけ作り直して push する。
# 手動実行のみ（自動ループ防止）。
#
# 事前確認: Settings → Actions → General → Workflow permissions
#   → "Read and write permissions" が有効であること
#   （contents: write が GITHUB_TOKEN に必要）

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to update (default: main)"
        required: false
        default: "main"
        type: string
      force_regenerate:
        description: "Delete existing lock and regenerate from package.json"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: regenerate-lock-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

jobs:
  regenerate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch || 'main' }}
          # push に必要（デフォルト true だが明示）
          persist-credentials: true
          # 古い lock と package.json の差分を確実に拾う
          fetch-depth: 0

      - name: Set up Node.js (Phase 3 pin)
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          # lock 再生成前は cache を使わない（古い lock で汚染しない）

      - name: Show environment
        run: |
          node -v
          npm -v
          cat package.json | head -n 40

      - name: Regenerate package-lock.json
        env:
          # electron のダウンロードは必要（postinstall / install-app-deps）
          ELECTRON_GET_USE_PROXY: "0"
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_regenerate }}" = "true" ]; then
            echo "Removing existing package-lock.json for clean regenerate..."
            rm -f package-lock.json
          fi
          # package.json のピンに合わせて lock を生成
          npm install --package-lock-only --ignore-scripts
          # lock の整合性を確認（実インストールはしないが検証はする）
          npm install --ignore-scripts
          echo "--- package-lock head ---"
          head -n 30 package-lock.json
          echo "--- lock packages (top-level) ---"
          node -e "const l=require('./package-lock.json'); console.log('lockfileVersion', l.lockfileVersion); console.log('packages root', Object.keys(l.packages||{}).slice(0,5)); const d=l.packages['']?.devDependencies||{}; console.log('devDependencies', d);"

      - name: Commit and push package-lock.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --staged --quiet; then
            echo "No changes to package-lock.json — nothing to commit."
            exit 0
          fi

          git commit -m "$(cat <<'EOF'
          chore: regenerate package-lock.json for Node 24 / Electron 43

          Generated by .github/workflows/regenerate-lock.yml (workflow_dispatch).
          Pins: electron@43.2.0, electron-builder@26.15.7, Node 24.18.0.
          EOF
          )"

          # 同時 push に備えて pull --rebase
          git pull --rebase origin "${{ inputs.target_branch || 'main' }}"
          git push origin "HEAD:${{ inputs.target_branch || 'main' }}"

          echo "Pushed updated package-lock.json to ${{ inputs.target_branch || 'main' }}"
