name: FullBuild AITranscribe-Electron for Windows

# 成果物:
#   Release Assets  … slim zip（モデルなし・2GB 未満）
#   Artifact full   … モデル込み完全版
#
# タグ方針:
#   workflow_dispatch で tag を空 → v0.1.0-YYYYMMDD を自動作成
#   同日に再実行 → v0.1.0-YYYYMMDD-2, -3 ...（既存タグを消さなくてよい）
#   tag=none → ビルドのみ（Release なし）
#   tag=v0.1.0-20260803 など → その名前で作成
#   タグ push (v*) でも従来どおりビルド + Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "空=日付自動 (v0.1.0-YYYYMMDD) / none=ビルドのみ / 任意タグ名"
        required: false
        default: ""
        type: string
      ref:
        description: "checkout する branch/SHA（空 = この workflow の ref）"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fullbuild-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || 'auto' }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  HF_HUB_DISABLE_UPDATE_CHECK: "1"
  # package.json version の major.minor に合わせる（日付サフィックス用）
  RELEASE_VERSION_PREFIX: "v0.1.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Set build date
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          echo "BUILD_DATE=$date" >> $env:GITHUB_ENV

      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag (date-based by default)
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PREFIX: ${{ env.RELEASE_VERSION_PREFIX }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
        run: |
          $tag = ""
          $doRelease = "false"

          if ($env:EVENT_NAME -eq "push" -and $env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:REF_NAME
            $doRelease = "true"
            Write-Host "Tag from push: $tag"
          } elseif ($env:EVENT_NAME -eq "workflow_dispatch") {
            $raw = if ($null -eq $env:INPUT_TAG) { "" } else { $env:INPUT_TAG.Trim() }

            if ($raw -eq "" -or $raw -eq "auto") {
              # 日付タグ自動: v0.1.0-YYYYMMDD / 衝突時 -2, -3...
              $base = "$($env:PREFIX)-$($env:BUILD_DATE)"
              $candidate = $base
              $n = 1
              while ($true) {
                git rev-parse -q --verify "refs/tags/$candidate" 2>$null | Out-Null
                $local = ($LASTEXITCODE -eq 0)
                git ls-remote --exit-code --tags origin "refs/tags/$candidate" 2>$null | Out-Null
                $remote = ($LASTEXITCODE -eq 0)
                if (-not $local -and -not $remote) { break }
                $n++
                $candidate = "$base-$n"
                if ($n -gt 50) {
                  Write-Error "Could not find free tag name under $base"
                  exit 1
                }
              }
              $tag = $candidate
              $doRelease = "true"
              Write-Host "Auto date tag: $tag"
            } elseif ($raw -match '^(none|skip|-)$') {
              $tag = ""
              $doRelease = "false"
              Write-Host "Build only (no release)"
            } else {
              # 任意タグ（v で始めること推奨）
              if ($raw -notmatch '^v[0-9A-Za-z._-]+$') {
                Write-Error "Invalid tag '$raw'. Use v0.1.0-20260803 style, empty for auto, or none."
                exit 1
              }
              git rev-parse -q --verify "refs/tags/$raw" 2>$null | Out-Null
              $local = ($LASTEXITCODE -eq 0)
              git ls-remote --exit-code --tags origin "refs/tags/$raw" 2>$null | Out-Null
              $remote = ($LASTEXITCODE -eq 0)
              if ($local -or $remote) {
                Write-Error "Tag $raw already exists. Leave tag empty for auto date, or pick a new name."
                exit 1
              }
              $tag = $raw
              $doRelease = "true"
              Write-Host "Custom tag: $tag"
            }
          }

          $short = (git rev-parse --short=7 HEAD)
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "do_release=$doRelease" >> $env:GITHUB_OUTPUT
          echo "git_short=$short" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved: tag=$tag do_release=$doRelease git_short=$short HEAD=$(git rev-parse HEAD)"

      - name: Create annotated tag (workflow_dispatch only)
        if: steps.meta.outputs.do_release == 'true' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 直前 step で未使用を確認済み。それでも競合したら失敗させる
          git rev-parse -q --verify "refs/tags/$env:TAG" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Race: tag $env:TAG appeared locally. Re-run workflow."
            exit 1
          }
          git tag -a $env:TAG -m "$env:TAG release (Actions workflow_dispatch)"
          git push origin "refs/tags/$env:TAG"
          Write-Host "Created and pushed tag $env:TAG -> $(git rev-parse HEAD)"

      - name: Set up Node.js (24 LTS)
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          package-manager-cache: false

      - name: Install Node.js dependencies (locked)
        run: npm ci

      - name: Set up Python for huggingface-cli
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface-cli via pip
        shell: pwsh
        run: |
          pip install huggingface_hub
          hf --version

      - name: FFmpeg Download
        shell: pwsh
        run: Invoke-WebRequest -UseBasicParsing -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -Outfile FFmpeg.zip

      - name: Python Embeddable Download (pinned 3.11.4)
        shell: pwsh
        run: Invoke-WebRequest -UseBasicParsing -Uri https://www.python.org/ftp/python/3.11.4/python-3.11.4-embed-amd64.zip -Outfile Python.zip

      - name: Setup FFmpeg + Embeddable + pinned pip deps (no Whisper models)
        shell: pwsh
        run: |
          Expand-Archive -Path FFmpeg.zip -DestinationPath FFmpeg-extracted
          Copy-Item -Path "FFmpeg-extracted\ffmpeg-master-latest-win64-lgpl\bin\ffmpeg.exe" -Destination "src\Whisper\ffmpeg.exe" -Force
          Expand-Archive -Path Python.zip -DestinationPath src/Whisper
          $pth = "src\Whisper\Python311._pth"
          if (Test-Path $pth) {
            (Get-Content $pth) -replace '#import site', 'import site' | Set-Content $pth
          }
          Invoke-WebRequest -UseBasicParsing -Uri https://bootstrap.pypa.io/get-pip.py -Outfile src\Whisper\get-pip.py
          src\Whisper\python.exe src\Whisper\get-pip.py
          src\Whisper\python.exe -m pip install -U "pip==25.0.1"
          Copy-Item requirements-whisper.txt src\Whisper\requirements-whisper.txt
          src\Whisper\python.exe -m pip install -r src\Whisper\requirements-whisper.txt

      - name: Build Electron project for Windows (slim — no model weights)
        run: npm run build_win
        env:
          BUILD_DATE: ${{ env.BUILD_DATE }}
          GIT_SHORT: ${{ steps.meta.outputs.git_short }}

      - name: List build outputs (pre-models)
        shell: pwsh
        run: |
          Get-ChildItem build -File -ErrorAction SilentlyContinue | Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,1)}}
          if (Test-Path build\win-unpacked) {
            $s = (Get-ChildItem -Recurse build\win-unpacked | Measure-Object Length -Sum).Sum
            Write-Host "win-unpacked size: $([math]::Round($s/1MB,1)) MB"
          }

      - name: Prepare slim release zip (models excluded)
        id: slim
        shell: pwsh
        env:
          BUILD_DATE: ${{ env.BUILD_DATE }}
          GIT_SHORT: ${{ steps.meta.outputs.git_short }}
        run: |
          $date = $env:BUILD_DATE
          $git = $env:GIT_SHORT
          $name = "AITranscribe-Electron-v0.1-${date}-${git}-x64-slim.zip"
          $dest = "build\$name"

          $builderZips = @(Get-ChildItem -Path build -Filter "AITranscribe-Electron-v0.1-*-x64.zip" -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notlike "*-slim.zip" })
          if ($builderZips.Count -ge 1) {
            $srcZip = $builderZips | Sort-Object Length | Select-Object -First 1
            Copy-Item -Path $srcZip.FullName -Destination $dest -Force
            Write-Host "Slim zip from builder: $($srcZip.Name) -> $name ($([math]::Round((Get-Item $dest).Length/1MB,1)) MB)"
          } else {
            $src = "build\win-unpacked"
            if (-not (Test-Path $src)) { Write-Error "build\win-unpacked not found"; exit 1 }
            if (Test-Path $dest) { Remove-Item -Force $dest }
            Add-Type -AssemblyName "System.IO.Compression.FileSystem"
            [System.IO.Compression.ZipFile]::CreateFromDirectory($src, $dest)
            Write-Host "Slim zip from win-unpacked: $name"
          }

          $bytes = (Get-Item $dest).Length
          $mb = [math]::Round($bytes / 1MB, 1)
          Write-Host "Slim release zip: $name = $mb MB"
          if ($bytes -gt 2GB) {
            Write-Error "Slim zip still exceeds 2GB ($mb MB). Abort."
            exit 1
          }
          echo "path=build/$name" >> $env:GITHUB_OUTPUT
          echo "name=$name" >> $env:GITHUB_OUTPUT

      - name: Upload slim release zip as artifact
        uses: actions/upload-artifact@v5
        with:
          name: AITranscribe-Electron-release-slim
          retention-days: 30
          path: ${{ steps.slim.outputs.path }}

      - name: Download Whisper models into win-unpacked (full artifact only)
        shell: pwsh
        run: |
          $root = "build\win-unpacked\resources\app\src\Whisper\models"
          if (-not (Test-Path "build\win-unpacked\resources\app\src\Whisper")) {
            $cand = Get-ChildItem -Path build\win-unpacked -Recurse -Directory -Filter Whisper -ErrorAction SilentlyContinue |
              Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
              Select-Object -First 1
            if (-not $cand) { Write-Error "Whisper dir not found under win-unpacked"; exit 1 }
            $root = Join-Path $cand.FullName "models"
            Write-Host "Whisper models root: $root"
          }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          hf download Systran/faster-whisper-small --local-dir "$root\small" --quiet
          hf download deepdml/faster-whisper-large-v3-turbo-ct2 --local-dir "$root\turbo" --quiet
          $s = (Get-ChildItem -Recurse build\win-unpacked | Measure-Object Length -Sum).Sum
          Write-Host "win-unpacked + models: $([math]::Round($s/1MB,1)) MB / $([math]::Round($s/1GB,2)) GB"

      - name: Upload full artifact (app + FFmpeg + Python + Whisper models)
        uses: actions/upload-artifact@v5
        with:
          name: AITranscribe-Electron-full
          retention-days: 30
          path: |
            build/win-unpacked/
            package-lock.json
            requirements-whisper.txt
            LICENSE
            THIRD_PARTY_NOTICES.md

      - name: Attach slim zip to GitHub Release
        if: steps.meta.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2.4.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          files: ${{ steps.slim.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## AITranscribe-Electron ${{ steps.meta.outputs.tag }}（文字起こし専用）

            オフライン（エアギャップ）向け Windows 文字起こしアプリです。
            **このリリースには要約機能（LLM）は含まれません。**

            ### Release Assets（本ページ）
            - **slim zip**（`${{ steps.slim.outputs.name }}`）: アプリ + FFmpeg + Python  
              **Whisper モデルなし**（GitHub 2GB 制限のため）

            ### 完全版（モデル込み）
            - この workflow run の **Artifacts → `AITranscribe-Electron-full`**（90 日）
            - または slim 展開後に `docs/models.md` で `models/small` / `models/turbo` を配置

            ### できること
            - Faster-Whisper 文字起こし（CPU int8 / 日本語 / VAD）
            - モデル 2 択: 速度重視 (small) / 精度重視 (turbo, 既定)
            - 実測進捗バー + タスクバー進捗
            - CSV 出力 + 文字起こしサポーター

            ### セットアップ（slim zip）
            1. zip を展開
            2. `docs/models.md` に従いモデルを配置
            3. 起動 → 音声選択 → スタート

            See THIRD_PARTY_NOTICES.md / docs/distribution.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
