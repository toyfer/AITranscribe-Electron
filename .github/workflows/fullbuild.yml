name: FullBuild AITranscribe-Electron for Windows

# Online assembly: npm ci + FFmpeg + Python Embeddable + models + electron-builder.
# On tag v*: also attach zip to the GitHub Release assets.
#
# バージョン管理: package.json は 0.1 固定。
# 日付と git コミットハッシュでユニーク性を担保。
# zip ファイル名: AITranscribe-Electron-v0.1-YYYYMMDD-GITSHORT-x64.zip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      # ビルド日 (UTC): zip ファイル名に埋め込む
      BUILD_DATE: ${{ github.event.repository.updated_at && format(github.event.repository.updated_at, 'YYYYMMDD') || github.run_id }}
      # git コミットハッシュ (短): 配布物のユニーク性
      GIT_SHORT: ${{ github.sha }}

    steps:
      - name: Set build date from workflow run
        if: env.BUILD_DATE == ''
        run: echo "BUILD_DATE=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_ENV

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js (24 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install Node.js dependencies (locked)
        run: npm ci

      - name: FFmpeg Download (CI assembly only; not committed to git)
        run: Invoke-WebRequest -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -Outfile FFmpeg.zip

      - name: Python Embeddable Download (pinned 3.11.4)
        run: Invoke-WebRequest -Uri https://www.python.org/ftp/python/3.11.4/python-3.11.4-embed-amd64.zip -Outfile Python.zip

      - name: Faster-Whisper models (small + turbo only)
        run: |
          git clone --depth 1 https://huggingface.co/Systran/faster-whisper-small .\src\Whisper\models\small\
          git clone --depth 1 https://huggingface.co/deepdml/faster-whisper-large-v3-turbo-ct2 .\src\Whisper\models\turbo\

      - name: Setup FFmpeg + Embeddable + pinned pip deps
        run: |
          Expand-Archive .\FFmpeg.zip .\
          Copy-Item -path .\ffmpeg-master-latest-win64-lgpl\bin\ffmpeg.exe .\src\Whisper\
          Expand-Archive .\Python.zip -DestinationPath .\src\Whisper
          (Get-Content .\src\Whisper\Python311._pth) -replace '#import site', 'import site' | Set-Content .\src\Whisper\Python311._pth
          Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -Outfile .\src\Whisper\get-pip.py
          .\src\Whisper\Python.exe .\src\Whisper\get-pip.py
          .\src\Whisper\Python.exe -m pip install -U "pip==25.0.1"
          Copy-Item .\requirements-whisper.txt .\src\Whisper\requirements-whisper.txt
          .\src\Whisper\Python.exe -m pip install -r .\src\Whisper\requirements-whisper.txt

      - name: Build Electron project for Windows
        run: npm run build_win
        env:
          BUILD_DATE: ${{ env.BUILD_DATE }}
          GIT_SHORT: ${{ env.GIT_SHORT }}

      - name: List build outputs
        run: Get-ChildItem -Recurse build | Select-Object FullName, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITranscribe-Electron
          path: |
            build/*.zip
            package-lock.json
            requirements-whisper.txt
            LICENSE
            THIRD_PARTY_NOTICES.md

      - name: Attach zip to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
