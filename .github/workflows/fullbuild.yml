name: FullBuild AITranscribe-Electron for Windows

# Online assembly: npm ci + FFmpeg + Python Embeddable + Whisper models + electron-builder.
#
# v0.1.0-transcribe (文字起こし専用):
#   llama-cli / GGUF は取得しない（要約は後続リリース）。
#
# 起動方法:
#   1. タグ push (v*) — 従来どおりビルド + Release 添付
#   2. workflow_dispatch — ビルドのみ、または tag 入力で「タグ作成 + ビルド + Release」
#
# 注意: GITHUB_TOKEN で作成したタグ push は他 workflow を起動しない。
#       そのため Release は必ずこの run 内で作成する。
#
# 2 種類の成果物:
#   1. Workflow artifact (Whisper モデル込み)
#   2. Release zip (モデル抜き・2GB 制限対応) — タグ時に GitHub Release へ添付
#
# zip: AITranscribe-Electron-v0.1-YYYYMMDD-GITSHORT-x64.zip

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release タグ (例: v0.1.0)。空ならビルドのみ（Release なし）"
        required: false
        default: ""
        type: string
      ref:
        description: "チェックアウトする branch/SHA（空 = この workflow が載っている ref）"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: fullbuild-${{ github.ref }}-${{ github.event.inputs.tag || 'notag' }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
  HF_HUB_DISABLE_UPDATE_CHECK: "1"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -like "refs/tags/v*") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $raw = "${{ github.event.inputs.tag }}".Trim()
            if ($raw -ne "") {
              if ($raw -notmatch '^v\d+\.\d+\.\d+') {
                Write-Error "tag must look like v0.1.0 (got: $raw)"
                exit 1
              }
              $tag = $raw
            }
          }
          $doRelease = if ($tag -ne "") { "true" } else { "false" }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "do_release=$doRelease" >> $env:GITHUB_OUTPUT
          Write-Host "tag=$tag do_release=$doRelease"

      - name: Set build date
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          echo "BUILD_DATE=$date" >> $env:GITHUB_ENV

      - name: Check out code
        uses: actions/checkout@v5
        with:
          # workflow_dispatch で ref 指定があればそれを使う。なければ github.ref
          ref: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Create annotated tag (workflow_dispatch only)
        if: steps.meta.outputs.do_release == 'true' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $exists = git rev-parse -q --verify "refs/tags/$env:TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $point = git rev-list -n 1 $env:TAG
            $head = git rev-parse HEAD
            if ($point -ne $head) {
              Write-Error "Tag $env:TAG already exists on $point (HEAD is $head). Delete the tag or pick another version."
              exit 1
            }
            Write-Host "Tag $env:TAG already points at HEAD — reuse"
          } else {
            git tag -a $env:TAG -m "$env:TAG release (Actions workflow_dispatch)"
            git push origin "refs/tags/$env:TAG"
            Write-Host "Created and pushed tag $env:TAG -> $(git rev-parse HEAD)"
          }

      - name: Set up Node.js (24 LTS)
        uses: actions/setup-node@v5
        with:
          node-version: "24.18.0"
          cache: npm
          package-manager-cache: false

      - name: Install Node.js dependencies (locked)
        run: npm ci

      - name: Set up Python for huggingface-cli
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface-cli via pip
        shell: pwsh
        run: |
          pip install huggingface_hub
          hf --version

      - name: FFmpeg Download
        shell: pwsh
        run: Invoke-WebRequest -UseBasicParsing -Uri https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip -Outfile FFmpeg.zip

      - name: Python Embeddable Download (pinned 3.11.4)
        shell: pwsh
        run: Invoke-WebRequest -UseBasicParsing -Uri https://www.python.org/ftp/python/3.11.4/python-3.11.4-embed-amd64.zip -Outfile Python.zip

      - name: Faster-Whisper models (small + turbo) via HF CLI
        shell: pwsh
        run: |
          hf download Systran/faster-whisper-small --local-dir src/Whisper/models/small --quiet
          hf download deepdml/faster-whisper-large-v3-turbo-ct2 --local-dir src/Whisper/models/turbo --quiet

      - name: Setup FFmpeg + Embeddable + pinned pip deps
        shell: pwsh
        run: |
          Expand-Archive -Path FFmpeg.zip -DestinationPath FFmpeg-extracted
          Copy-Item -Path "FFmpeg-extracted\ffmpeg-master-latest-win64-lgpl\bin\ffmpeg.exe" -Destination "src\Whisper\ffmpeg.exe" -Force
          Expand-Archive -Path Python.zip -DestinationPath src/Whisper
          $pth = "src\Whisper\Python311._pth"
          if (Test-Path $pth) {
            (Get-Content $pth) -replace '#import site', 'import site' | Set-Content $pth
          }
          Invoke-WebRequest -UseBasicParsing -Uri https://bootstrap.pypa.io/get-pip.py -Outfile src\Whisper\get-pip.py
          src\Whisper\python.exe src\Whisper\get-pip.py
          src\Whisper\python.exe -m pip install -U "pip==25.0.1"
          Copy-Item requirements-whisper.txt src\Whisper\requirements-whisper.txt
          src\Whisper\python.exe -m pip install -r src\Whisper\requirements-whisper.txt

      - name: Build Electron project for Windows
        run: npm run build_win
        env:
          BUILD_DATE: ${{ env.BUILD_DATE }}
          GIT_SHORT: ${{ github.sha }}

      - name: List build outputs
        shell: pwsh
        run: Get-ChildItem -Recurse build | Select-Object FullName, Length

      - name: Build release zip without large models
        shell: pwsh
        env:
          BUILD_DATE: ${{ env.BUILD_DATE }}
          GIT_SHORT: ${{ github.sha }}
        run: |
          $src = "build\win-unpacked"
          if (-not (Test-Path $src)) {
            Write-Error "build\win-unpacked not found"
            exit 1
          }
          $stage = "build\release-staging"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "$src\*" -Destination $stage -Recurse -Force

          $toRemove = @(
            "resources\app\src\Whisper\models\small",
            "resources\app\src\Whisper\models\turbo",
            "resources\app\src\Whisper\llama-cli.exe",
            "resources\app\src\Whisper\models\llm"
          )
          foreach ($p in $toRemove) {
            $full = Join-Path $stage $p
            if (Test-Path $full) {
              Remove-Item -Recurse -Force $full
              Write-Host "Removed from release zip: $p"
            } else {
              Write-Host "NOT FOUND (skipped): $p"
            }
          }

          $stageSize = (Get-ChildItem -Recurse $stage | Measure-Object -Property Length -Sum).Sum
          $stageSizeGB = [math]::Round($stageSize / 1GB, 2)
          Write-Host "Staging directory size after removal: $stageSizeGB GB"

          $date = $env:BUILD_DATE
          $git = $env:GIT_SHORT.Substring(0, 7)
          $releaseZipName = "AITranscribe-Electron-v0.1-${date}-${git}-x64.zip"
          $releaseZip = "build\$releaseZipName"
          if (Test-Path $releaseZip) { Remove-Item -Force $releaseZip }
          Add-Type -AssemblyName "System.IO.Compression.FileSystem"
          [System.IO.Compression.ZipFile]::CreateFromDirectory($stage, $releaseZip)
          $sizeGB = [math]::Round((Get-Item $releaseZip).Length / 1GB, 2)
          Write-Host "Release zip: $releaseZipName = $sizeGB GB"
          if ((Get-Item $releaseZip).Length -gt 2GB) {
            Write-Error "Release zip exceeds 2GB ($sizeGB GB). GitHub Release will reject."
            exit 1
          }

      - name: Upload workflow artifact (full with Whisper models)
        uses: actions/upload-artifact@v5
        with:
          name: AITranscribe-Electron-full
          retention-days: 30
          path: |
            build/win-unpacked/
            package-lock.json
            requirements-whisper.txt
            LICENSE
            THIRD_PARTY_NOTICES.md

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v5
        with:
          name: AITranscribe-Electron-release
          retention-days: 30
          path: build/AITranscribe-Electron-v0.1-*-x64.zip

      - name: Attach release zip to GitHub Release
        if: steps.meta.outputs.do_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: build/AITranscribe-Electron-v0.1-*-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## AITranscribe-Electron ${{ steps.meta.outputs.tag }}（文字起こし専用）

            オフライン（エアギャップ）向け Windows 文字起こしアプリです。
            **このリリースには要約機能（LLM）は含まれません。** 文字起こしのみ確実に使えます。

            ### できること
            - Faster-Whisper による音声文字起こし（CPU int8 / 日本語 / VAD）
            - モデル 2 択: 速度重視 (small) / 精度重視 (turbo, 既定)
            - 実測ベース進捗バー + タスクバー進捗
            - CSV 出力 + 文字起こしサポーター（CSV ビューア）

            ### 含まれないもの（後続リリース）
            - LLM 要約 / Word (.docx) 出力
            - llama-cli / GGUF

            ### 成果物
            - **Release zip**（本 Assets）: アプリ + FFmpeg + Python（**Whisper モデルなし**・2GB 制限対応）
            - **full artifact**（Actions）: 上記 + small/turbo モデル込み（90 日）

            ### セットアップ
            1. zip を展開
            2. `docs/models.md` に従い `models/small` または `models/turbo` を配置
            3. 起動 → 音声選択 → スタート

            See THIRD_PARTY_NOTICES.md / docs/distribution.md.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
