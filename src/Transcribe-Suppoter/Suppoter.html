<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' blob:" />
    <script src="../theme-init.js"></script>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", sans-serif;
        }
        .text-link {
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .text-link:hover {
            text-decoration: underline;
        }
    </style>
    <title>文字起こしサポーター</title>
</head>

<!--
  App shell: 単一の flex チェーン
  body(d-flex.flex-column.min-vh-100)
    └─ header (固定)
    └─ main(flex-grow-1.overflow-hidden.d-flex.flex-column)
         └─ .container(flex-grow-1.d-flex.flex-column)
              ├─ .row ファイル選択 (固定)
              └─ .card 発言テーブル (flex:1 1 0, min-height:0)
                   └─ .card-body(flex:1 1 0, min-height:0, d-flex.flex-column, p-0)
                        └─ .csv-table-wrapper(flex:1 1 0, min-height:0, overflow-y:auto)
    └─ footer 再生プレイヤー (固定, 常に最下層)

  NOTE: このページは <a href> による同一 BrowserWindow 内の遷移です。
  遷移中は transcribe ウィンドウの IPC リスナー (return:Command, process:Progress 等) が
  切断されるため、文字起こし実行中はこのページを開かないでください。
  要約サポーターと異なり、このページは独立した BrowserWindow ではありません。
-->
<body class="d-flex flex-column min-vh-100">

    <header class="border-bottom">
        <div class="container py-2">
            <div class="row align-items-center g-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0 fs-3">文字起こしサポーター</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="../index.html">戻る</a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <p class="text-muted small mb-0 mt-1">CSVと音声ファイルを読み込んで、聞きたい箇所のテキストをクリックすると、その時間から音声が再生されます。</p>
                </div>
                <div class="col-12">
                    <p class="text-warning small mb-0 mt-1">⚠ 文字起こし実行中はこのページを開かないでください。進捗ログが表示されなくなります。</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 overflow-hidden d-flex flex-column">
        <div class="container py-3 flex-grow-1 d-flex flex-column">

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title text-muted mb-2">CSVファイル</h6>
                            <input class="form-control form-control-sm" type="file" id="csvFileInput" accept=".csv" />
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title text-muted mb-2">音声ファイル</h6>
                            <input class="form-control form-control-sm" type="file" id="audioFileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.wma" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- 発言テーブル: 単一flexチェーンの最終段で flex:1 1 0 -->
            <div class="card flex-grow-1 d-flex flex-column" style="min-height: 0;">
                <div class="card-body flex-grow-1 d-flex flex-column p-0" style="min-height: 0;">
                    <div class="csv-table-wrapper flex-grow-1" style="min-height: 0; overflow-y: auto;">
                        <table class="table table-bordered table-sm table-hover mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">No.</th>
                                    <th style="width: 80px;">開始</th>
                                    <th style="width: 80px;">終了</th>
                                    <th>テキスト</th>
                                </tr>
                            </thead>
                            <tbody id="csvTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 再生プレイヤー: 独立した最下層。テーブルの flex-grow と無関係に常に表示 -->
    <footer class="border-top">
        <div class="container py-2">
            <div class="card">
                <div class="card-body py-2">
                    <audio id="audio" class="w-100" controls></audio>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="./Suppoter.js"></script>
</body>

</html>
