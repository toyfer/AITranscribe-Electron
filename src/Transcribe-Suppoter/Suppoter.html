<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' blob:" />
    <script src="../theme-init.js"></script>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", sans-serif;
            display: flex;
            flex-direction: column;
        }
        .text-link {
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .text-link:hover {
            text-decoration: underline;
        }
        header, footer {
            flex-shrink: 0;
        }
        /* main を flex コンテナにして残り領域を埋める */
        .main-area {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* .container に height: 100% を明示して flex の高さを確定させる */
        .main-area > .container {
            flex: 1 1 0;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .main-area > .container > .content-wrapper {
            flex: 1 1 0;
            min-height: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        /* テーブルカードを残り領域いっぱいに広げる */
        .table-card {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .table-card .card-body {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
        }
        .csv-table-wrapper {
            flex: 1 1 0;
            min-height: 0;
            height: 100%;
            overflow-y: auto;
        }
        .csv-table-wrapper table {
            margin-bottom: 0;
        }
        .csv-table-wrapper thead th {
            position: sticky;
            top: 0;
            background: var(--bs-body-bg);
            z-index: 1;
        }
    </style>
    <title>文字起こしサポーター</title>
</head>

<body>
    <header class="border-bottom">
        <div class="container">
            <div class="row align-items-center py-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0">文字起こしサポーター</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="../index.html">戻る</a>
                </div>
            </div>
            <div class="row pb-2">
                <div class="col-12">
                    <p class="text-muted small mb-0">CSVと音声ファイルを読み込んで、聞きたい箇所のテキストをクリックすると、その時間から音声が再生されます。</p>
                </div>
            </div>
        </div>
    </header>

    <main class="main-area">
        <div class="container py-3">
            <div class="content-wrapper">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body py-2">
                                <h6 class="card-title text-muted mb-1">CSVファイル</h6>
                                <input class="form-control form-control-sm" type="file" id="csvFileInput" accept=".csv" />
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body py-2">
                                <h6 class="card-title text-muted mb-1">音声ファイル</h6>
                                <input class="form-control form-control-sm" type="file" id="audioFileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.wma" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card table-card">
                    <div class="card-body">
                        <div class="csv-table-wrapper">
                            <table class="table table-bordered table-sm table-hover mb-0">
                                <thead>
                                    <tr>
                                        <th style="width: 60px;">No.</th>
                                        <th style="width: 80px;">開始</th>
                                        <th style="width: 80px;">終了</th>
                                        <th>テキスト</th>
                                    </tr>
                                </thead>
                                <tbody id="csvTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top">
        <div class="container py-2">
            <div class="card">
                <div class="card-body py-2">
                    <audio id="audio" class="w-100" controls></audio>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="./Suppoter.js"></script>
</body>

</html>
