<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' blob:" />
    <script src="../theme-init.js"></script>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <style>
        /* フォント: BIZ UDGothic (Windows 10/11 標準搭載) */
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", sans-serif;
        }
        .text-link {
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .text-link:hover {
            text-decoration: underline;
        }

        /* ============================================================
           全体構成: Bootstrapのcontainer/row/col階層をフル活用
           動的追従は table-card-body 内に閉じる
           ============================================================ */

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .supporter-main {
            flex: 1 1 auto;
            min-height: 0;
        }
        .supporter-header,
        .supporter-footer {
            flex: 0 0 auto;
        }

        /* テーブルカードの中身だけ flex で制御 */
        .table-card-body {
            display: flex;
            flex-direction: column;
            padding: 0;
            min-height: 240px;
        }
        .csv-table-wrapper {
            flex: 1 1 auto;
            min-height: 120px;
            overflow-y: auto;
        }
        .csv-table-wrapper table {
            margin-bottom: 0;
        }
        .csv-table-wrapper thead th {
            position: sticky;
            top: 0;
            background: var(--bs-body-bg);
            z-index: 1;
        }
    </style>
    <title>文字起こしサポーター</title>
</head>

<body>
    <!-- ヘッダー: タイトル + 戻るボタン + 説明 -->
    <header class="supporter-header border-bottom">
        <div class="container py-2">
            <div class="row align-items-center g-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0 fs-3">文字起こしサポーター</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="../index.html">戻る</a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <p class="text-muted small mb-0 mt-1">CSVと音声ファイルを読み込んで、聞きたい箇所のテキストをクリックすると、その時間から音声が再生されます。</p>
                </div>
            </div>
        </div>
    </header>

    <!-- メイン: ファイル選択 + 発言テーブル -->
    <main class="supporter-main py-3">
        <div class="container">
            <div class="row g-3">
                <!-- ファイル選択カード (2列) -->
                <div class="col-12">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h6 class="card-title text-muted mb-2">CSVファイル</h6>
                                    <input class="form-control form-control-sm" type="file" id="csvFileInput" accept=".csv" />
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-body">
                                    <h6 class="card-title text-muted mb-2">音声ファイル</h6>
                                    <input class="form-control form-control-sm" type="file" id="audioFileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.wma" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 発言テーブルカード -->
                <div class="col-12">
                    <div class="card">
                        <div class="card-body table-card-body">
                            <div class="csv-table-wrapper">
                                <table class="table table-bordered table-sm table-hover mb-0">
                                    <thead>
                                        <tr>
                                            <th style="width: 60px;">No.</th>
                                            <th style="width: 80px;">開始</th>
                                            <th style="width: 80px;">終了</th>
                                            <th>テキスト</th>
                                        </tr>
                                    </thead>
                                    <tbody id="csvTableBody"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター: 再生プレイヤー -->
    <footer class="supporter-footer border-top">
        <div class="container py-2">
            <div class="card">
                <div class="card-body py-2">
                    <audio id="audio" class="w-100" controls></audio>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="./Suppoter.js"></script>
</body>

</html>
