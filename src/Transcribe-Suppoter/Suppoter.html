<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' blob:" />
    <script src="../theme-init.js"></script>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <link href="../css/transcribe-suppoter.css" rel="stylesheet" />
    <title>文字起こしサポーター</title>
</head>

<!--
  App shell: 単一の flex チェーン (CSP 上、スタイルはすべて外部 CSS)
  body(d-flex.flex-column.vh-100.overflow-hidden) ← ビューポート高さに固定
    ├─ header (flex-shrink-0, 固定)
    ├─ main(flex-grow-1.overflow-hidden.d-flex.flex-column)
    │    └─ .container(flex-grow-1.d-flex.flex-column.flex-min-0)
    │         ├─ .row ファイル選択 (flex-shrink-0)
    │         └─ .card 発言テーブル (flex-grow-1.flex-min-0)
    │              └─ .card-body(flex-grow-1.flex-min-0, p-0)
    │                   └─ .csv-table-wrapper(flex-grow-1.flex-min-0, overflow-y:auto)
    │                        ※ テーブルはこの領域内でのみスクロールする
    └─ footer 再生プレイヤー (flex-shrink-0, 常に最下層に固定)

  CSP 注意: default-src 'self' のため style 属性・<style> ブロックは一切反映されない。
  レイアウトを変更するときは ../css/transcribe-suppoter.css を編集すること。

  NOTE: このページは <a href> による同一 BrowserWindow 内の遷移です。
  遷移中は transcribe ウィンドウの IPC リスナー (return:Command, process:Progress 等) が
  切断されるため、文字起こし実行中はこのページを開かないでください。
  要約サポーターと異なり、このページは独立した BrowserWindow ではありません。
-->
<body class="d-flex flex-column vh-100 overflow-hidden">

    <header class="border-bottom flex-shrink-0">
        <div class="container py-2">
            <div class="row align-items-center g-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0 fs-3">文字起こしサポーター</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="../index.html">戻る</a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <p class="text-muted small mb-0 mt-1">CSVと音声ファイルを読み込んで、聞きたい箇所の「開始」ボタンやテキストをクリックすると、その時間から音声が再生されます。</p>
                </div>
                <div class="col-12">
                    <p class="text-warning small mb-0 mt-1">⚠ 文字起こし実行中はこのページを開かないでください。進捗ログが表示されなくなります。</p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 overflow-hidden d-flex flex-column">
        <div class="container py-3 flex-grow-1 d-flex flex-column flex-min-0">

            <div class="row g-3 mb-3 flex-shrink-0">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title text-muted mb-2">CSVファイル</h6>
                            <input class="form-control form-control-sm" type="file" id="csvFileInput" accept=".csv" />
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title text-muted mb-2">音声ファイル</h6>
                            <input class="form-control form-control-sm" type="file" id="audioFileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.wma" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- 発言テーブル: 単一flexチェーンの最終段で flex-grow + min-height:0。
                 スクロールは .csv-table-wrapper の中でのみ発生する -->
            <div class="card flex-grow-1 d-flex flex-column flex-min-0">
                <div class="card-body flex-grow-1 d-flex flex-column p-0 flex-min-0">
                    <div class="csv-table-wrapper flex-grow-1 flex-min-0">
                        <table class="table table-bordered table-sm table-hover mb-0">
                            <thead>
                                <tr>
                                    <th class="col-no">No.</th>
                                    <th class="col-start">開始</th>
                                    <th class="col-end">終了</th>
                                    <th>テキスト</th>
                                </tr>
                            </thead>
                            <tbody id="csvTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- 再生プレイヤー: 独立した最下層。テーブルのスクロールと無関係に常に表示 -->
    <footer class="border-top flex-shrink-0">
        <div class="container py-2">
            <div class="card">
                <div class="card-body py-2">
                    <audio id="audio" class="w-100" controls></audio>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="./Suppoter.js"></script>
</body>

</html>
