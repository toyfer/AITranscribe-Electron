<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' blob:" />
    <script src="../theme-init.js"></script>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", sans-serif;
            /* body 自体を Grid にして 3 行で app shell を構成 */
            display: grid;
            grid-template-rows: auto 1fr auto;
        }
        .text-link {
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .text-link:hover {
            text-decoration: underline;
        }

        /* header / footer は内容に合わせて固定高さ */
        header, footer {
            overflow: hidden;
        }

        /* main も Grid にして、内側の要素の高さを直接制御 */
        main {
            display: grid;
            grid-template-rows: auto 1fr; /* ファイル入力 / テーブル */
            gap: 1rem;
            overflow: hidden;
            padding: 1rem;
            /* Bootstrap .container の max-width を維持しつつ Grid で高さ制御 */
            max-width: var(--bs-breakpoint-lg, 960px);
            margin: 0 auto;
            width: 100%;
        }

        /* テーブルカードの中身も Grid で制御 */
        .table-card {
            display: grid;
            grid-template-rows: 1fr; /* テーブルラッパのみ */
            overflow: hidden;
            min-height: 0;
        }
        .table-card .card-body {
            display: grid;
            grid-template-rows: 1fr; /* テーブルラッパのみ */
            overflow: hidden;
            min-height: 0;
            padding: 0;
        }
        .csv-table-wrapper {
            overflow-y: auto;
            min-height: 0;
        }
        .csv-table-wrapper table {
            margin-bottom: 0;
        }
        .csv-table-wrapper thead th {
            position: sticky;
            top: 0;
            background: var(--bs-body-bg);
            z-index: 1;
        }
    </style>
    <title>文字起こしサポーター</title>
</head>

<body>
    <header class="border-bottom">
        <div class="container">
            <div class="row align-items-center py-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0">文字起こしサポーター</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="../index.html">戻る</a>
                </div>
            </div>
            <div class="row pb-2">
                <div class="col-12">
                    <p class="text-muted small mb-0">CSVと音声ファイルを読み込んで、聞きたい箇所のテキストをクリックすると、その時間から音声が再生されます。</p>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="row g-3">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body py-2">
                        <h6 class="card-title text-muted mb-1">CSVファイル</h6>
                        <input class="form-control form-control-sm" type="file" id="csvFileInput" accept=".csv" />
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body py-2">
                        <h6 class="card-title text-muted mb-1">音声ファイル</h6>
                        <input class="form-control form-control-sm" type="file" id="audioFileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.wma" />
                    </div>
                </div>
            </div>
        </div>

        <div class="card table-card">
            <div class="card-body">
                <div class="csv-table-wrapper">
                    <table class="table table-bordered table-sm table-hover mb-0">
                        <thead>
                            <tr>
                                <th style="width: 60px;">No.</th>
                                <th style="width: 80px;">開始</th>
                                <th style="width: 80px;">終了</th>
                                <th>テキスト</th>
                            </tr>
                        </thead>
                        <tbody id="csvTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-top">
        <div class="container py-2">
            <div class="card">
                <div class="card-body py-2">
                    <audio id="audio" class="w-100" controls></audio>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="./Suppoter.js"></script>
</body>

</html>
