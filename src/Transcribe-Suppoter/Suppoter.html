<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' blob:">
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <title>文字起こしサポーター</title>
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h2 id="title-label">文字起こしサポーター</h2>
                </div>

                <div class="col-10">
                    <p>CSVと音声ファイルを読み込んで、聞きたい箇所の[TEXT]列をクリックすると、選択した時間から音声が再生されます。</p>
                </div>

                <div class="col-2 d-grid gap-2">
                    <a class="btn btn-secondary" href="../index.html">戻る</a>
                </div>

                <div class="col-6">
                    <label for="csvFileInput" class="form-label">CSVファイル</label>
                    <input class="form-control" type="file" id="csvFileInput" accept=".csv" />
                </div>

                <div class="col-6">
                    <label for="audioFileInput" class="form-label">音声ファイル</label>
                    <input class="form-control" type="file" id="audioFileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.wma" />
                </div>
            </div>
        </div>
    </header>

    <hr />

    <main class="main">
        <div class="container">
            <div class="row">
                <div class="col">
                    <table class="table table-bordered table-sm table-hover">
                        <thead>
                            <tr>
                                <th>Point</th>
                                <th>Start</th>
                                <th>End</th>
                                <th>Text</th>
                            </tr>
                        </thead>
                        <tbody id="csvTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="fixed-bottom bg-white border">
                        <audio id="audio" class="float-end"></audio>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="./Suppoter.js"></script>
</body>

</html>
