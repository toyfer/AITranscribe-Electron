<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' blob:" />
    <script src="../theme-init.js"></script>
    <link href="../css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", sans-serif;
        }
        .text-link {
            cursor: pointer;
            text-decoration: underline dotted;
        }
        .text-link:hover {
            text-decoration: underline;
        }

        /* テーブルカード内: card-body を縦flexにしてテーブルだけ伸びる */
        .table-card {
            display: flex;
            flex-direction: column;
        }
        .table-card .card-body {
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            padding: 0;
        }
        .table-card .csv-table-wrapper {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
        }
        .table-card table {
            margin-bottom: 0;
        }
        .table-card thead th {
            position: sticky;
            top: 0;
            background: var(--bs-body-bg);
            z-index: 1;
        }
    </style>
    <title>文字起こしサポーター</title>
</head>

<!--
  App shell: Bootstrap 5.3 標準の sticky footer + app パターン
-->
<body class="d-flex flex-column min-vh-100">

    <!-- ヘッダー: タイトル + 戻る + 説明 -->
    <header class="border-bottom">
        <div class="container py-2">
            <div class="row align-items-center g-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0 fs-3">文字起こしサポーター</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="../index.html">戻る</a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <p class="text-muted small mb-0 mt-1">CSVと音声ファイルを読み込んで、聞きたい箇所のテキストをクリックすると、その時間から音声が再生されます。</p>
                </div>
            </div>
        </div>
    </header>

    <!-- メイン: ファイル選択 + 発言テーブル -->
    <main class="flex-grow-1 overflow-hidden d-flex flex-column">
        <div class="container py-3 flex-grow-1 d-flex flex-column">
            <!-- ファイル選択 (2列) -->
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title text-muted mb-2">CSVファイル</h6>
                            <input class="form-control form-control-sm" type="file" id="csvFileInput" accept=".csv" />
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title text-muted mb-2">音声ファイル</h6>
                            <input class="form-control form-control-sm" type="file" id="audioFileInput" accept=".mp3,.wav,.m4a,.flac,.ogg,.wma" />
                        </div>
                    </div>
                </div>
            </div>

            <!-- 発言テーブル: flex-grow-1 + mt-auto で残り領域を埋める -->
            <div class="card table-card flex-grow-1 mt-auto">
                <div class="card-body">
                    <div class="csv-table-wrapper">
                        <table class="table table-bordered table-sm table-hover mb-0">
                            <thead>
                                <tr>
                                    <th style="width: 60px;">No.</th>
                                    <th style="width: 80px;">開始</th>
                                    <th style="width: 80px;">終了</th>
                                    <th>テキスト</th>
                                </tr>
                            </thead>
                            <tbody id="csvTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター: 再生プレイヤー -->
    <footer class="border-top mt-auto">
        <div class="container py-2">
            <div class="card">
                <div class="card-body py-2">
                    <audio id="audio" class="w-100" controls></audio>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="./Suppoter.js"></script>
</body>

</html>
