<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <script src="./theme-init.js"></script>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* フォント: BIZ UDGothic (Windows 10/11 標準搭載) */
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", sans-serif;
        }
        .font-monospace {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", "Cascadia Mono", "Consolas", monospace;
        }
        .section-title {
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        /* ログを広く使うための調整 */
        .log-card {
            min-height: 220px;
        }
        .log-card textarea {
            font-size: 13px;
            line-height: 1.5;
        }
        /* パラメータ入力: コンパクトな幅 */
        .param-input {
            max-width: 120px;
        }
    </style>
    <title>AI文字起こし</title>
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="border-bottom">
        <div class="container-fluid py-2">
            <div class="row align-items-center g-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0 fs-3">AI文字起こし</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="./Transcribe-Suppoter/Suppoter.html">文字起こしサポーターを起動</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow-1 overflow-hidden d-flex flex-column">
        <div class="container-fluid py-3 flex-grow-1 d-flex flex-column">

            <!-- 文字起こしカード: モデル選択 + ファイル選択 + 実行 -->
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="section-title mb-3">文字起こし</h5>

                    <div class="row g-3 align-items-center">
                        <div class="col-md-3">
                            <h6 class="card-title text-muted mb-2">モデルの選択</h6>
                            <div class="btn-group w-100" role="group" aria-label="モデル選択">
                                <input type="radio" class="btn-check" name="model" id="model-small" autocomplete="off" value="small">
                                <label class="btn btn-outline-primary" for="model-small">速度重視</label>

                                <input type="radio" class="btn-check" name="model" id="model-turbo" autocomplete="off" value="turbo" checked>
                                <label class="btn btn-outline-primary" for="model-turbo">精度重視（推奨）</label>
                            </div>
                        </div>

                        <div class="col-md-9">
                            <h6 class="card-title text-muted mb-2">音声ファイル</h6>
                            <div class="row g-2 align-items-center">
                                <div class="col-md-7">
                                    <input readonly type="text" class="form-control" id="file-path"
                                        aria-label="選択中の音声ファイル" placeholder="音声ファイルを選択してください">
                                </div>
                                <div class="col-md-2 d-grid">
                                    <button type="button" class="btn btn-outline-primary" id="file-select-button">ファイル選択</button>
                                </div>
                                <div class="col-md-3 d-grid">
                                    <button type="button" class="btn btn-success" id="run-ffmpeg">
                                        <span aria-hidden="true">▶</span> スタート
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 要約カード: パラメータ + ファイル選択 + 種別 + 実行 -->
            <div class="card mb-3">
                <div class="card-body">
                    <h5 class="section-title mb-3">要約</h5>

                    <div class="row g-3">
                        <!-- 要約パラメータ -->
                        <div class="col-md-6">
                            <h6 class="card-title text-muted mb-2">パラメータ</h6>
                            <div class="row g-2 align-items-center">
                                <div class="col-auto">
                                    <label for="param-ctx" class="col-form-label col-form-label-sm">ctx size</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" class="form-control form-control-sm param-input"
                                        id="param-ctx" value="4096" min="512" max="32768" step="512"
                                        aria-label="コンテキストサイズ">
                                </div>
                                <div class="col-auto">
                                    <label for="param-tokens" class="col-form-label col-form-label-sm">max tokens</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" class="form-control form-control-sm param-input"
                                        id="param-tokens" value="1024" min="128" max="8192" step="128"
                                        aria-label="最大トークン数">
                                </div>
                                <div class="col-auto">
                                    <label for="param-temp" class="col-form-label col-form-label-sm">temp</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" class="form-control form-control-sm param-input"
                                        id="param-temp" value="0.4" min="0" max="2" step="0.1"
                                        aria-label="温度パラメータ">
                                </div>
                            </div>
                        </div>

                        <!-- 要約種別 -->
                        <div class="col-md-6">
                            <h6 class="card-title text-muted mb-2">要約種別</h6>
                            <div class="btn-group w-100" role="group" aria-label="要約種別">
                                <input type="radio" class="btn-check" name="summary-type" id="type-bullets"
                                    autocomplete="off" value="bullets" checked>
                                <label class="btn btn-outline-primary" for="type-bullets">箇条書き</label>

                                <input type="radio" class="btn-check" name="summary-type" id="type-minutes"
                                    autocomplete="off" value="minutes">
                                <label class="btn btn-outline-primary" for="type-minutes">議事録</label>

                                <input type="radio" class="btn-check" name="summary-type" id="type-summary"
                                    autocomplete="off" value="summary">
                                <label class="btn btn-outline-primary" for="type-summary">要約</label>
                            </div>
                        </div>
                    </div>

                    <hr class="my-3">

                    <div class="row g-2 align-items-center">
                        <div class="col-md-7">
                            <h6 class="card-title text-muted mb-2">CSVファイル</h6>
                            <input readonly type="text" class="form-control" id="csv-path"
                                aria-label="選択中のCSVファイル" placeholder="CSVファイルを選択してください">
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="button" class="btn btn-outline-primary" id="csv-select-button">ファイル選択</button>
                        </div>
                        <div class="col-md-1 d-grid">
                            <button type="button" class="btn btn-outline-secondary" id="csv-clear-button" title="クリア">×</button>
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="button" class="btn btn-success" id="run-summarize">
                                <span aria-hidden="true">▶</span> 要約を実行
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 進捗カード (両機能共有) -->
            <div class="card progress-card mb-3">
                <div class="card-body py-2">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <h6 class="card-title text-muted mb-0 text-nowrap">進捗</h6>
                        <p class="small text-muted mb-0 flex-grow-1" id="progress-phase" hidden></p>
                    </div>
                    <div hidden class="progress" role="progressbar" aria-label="progressbar-aria" aria-valuenow="0"
                        aria-valuemin="0" aria-valuemax="100" id="progress" style="height: 22px;">
                        <div class="progress-bar bg-success" id="progress-bar"></div>
                    </div>
                </div>
            </div>

            <!-- ログカード: タブ切替で「文字起こし / 要約」を切替 -->
            <div class="card flex-grow-1 d-flex flex-column log-card" style="min-height: 0;">
                <div class="card-body flex-grow-1 d-flex flex-column p-0" style="min-height: 0;">
                    <div class="d-flex justify-content-between align-items-center p-3 pb-2">
                        <div class="btn-group btn-group-sm" role="group" aria-label="ログ切替">
                            <button type="button" class="btn btn-primary" data-log-tab="transcribe"
                                id="log-tab-transcribe">文字起こしログ</button>
                            <button type="button" class="btn btn-outline-primary" data-log-tab="summary"
                                id="log-tab-summary">要約ログ</button>
                        </div>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="log-clear-button"
                            data-clear-target="active">クリア</button>
                    </div>
                    <div class="flex-grow-1 position-relative" style="min-height: 0;">
                        <textarea readonly class="form-control font-monospace position-absolute top-0 start-0 end-0 bottom-0"
                            id="output-textarea"
                            style="min-height: 0; resize: none; border-top-left-radius: 0; border-top-right-radius: 0;"
                            data-log-pane="transcribe"></textarea>
                        <textarea readonly class="form-control font-monospace position-absolute top-0 start-0 end-0 bottom-0 d-none"
                            id="summary-log"
                            style="min-height: 0; resize: none; border-top-left-radius: 0; border-top-right-radius: 0;"
                            data-log-pane="summary"></textarea>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="./progressbar.js"></script>
    <script src="./renderer.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
