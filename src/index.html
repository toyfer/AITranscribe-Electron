<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <script src="./theme-init.js"></script>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", sans-serif;
            overflow: hidden;
        }
        .font-monospace {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", monospace;
        }

        /* 画面全体: Bootstrapの container/row/col 構成は維持 */
        .app-shell {
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header,
        .app-footer {
            flex: 0 0 auto;
        }
        .app-main {
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }
        .app-main > .container,
        .app-main > .container > .row,
        .app-main-content {
            height: 100%;
            min-height: 0;
        }
        .app-main-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        /* 最初のカードUIの余白・幅を保ったまま、ログだけ残り領域へ伸縮 */
        #log-card-container {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
        }
        #log-card {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        #log-card .card-body {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        #output-textarea {
            flex: 1 1 auto;
            min-height: 80px;
            resize: none;
        }

        /* 進捗カードは通常のBootstrapカードの余白を維持 */
        .progress-card .card-body {
            padding-top: 0.75rem;
            padding-bottom: 0.75rem;
        }
    </style>
    <title>AI文字起こし</title>
</head>

<body>
    <div class="app-shell">
        <header class="app-header border-bottom mb-3">
            <div class="container">
                <div class="row align-items-center py-2">
                    <div class="col">
                        <h2 id="title-label" class="mb-0">AI文字起こし</h2>
                    </div>
                    <div class="col-auto">
                        <a class="btn btn-outline-secondary btn-sm" href="./Transcribe-Suppoter/Suppoter.html">文字起こしサポーターを起動</a>
                    </div>
                </div>
            </div>
        </header>

        <main class="app-main" id="app-main">
            <div class="container">
                <div class="row">
                    <div class="col-12 app-main-content">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title text-muted">モデルの選択</h6>
                                <div class="btn-group w-100" role="group" aria-label="モデル選択">
                                    <input type="radio" class="btn-check" name="model" id="model-small" autocomplete="off" value="small">
                                    <label class="btn btn-outline-primary" for="model-small">速度重視</label>

                                    <input type="radio" class="btn-check" name="model" id="model-turbo" autocomplete="off" value="turbo" checked>
                                    <label class="btn btn-outline-primary" for="model-turbo">精度重視（推奨）</label>
                                </div>
                            </div>
                        </div>

                        <div class="card progress-card">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h6 class="card-title text-muted mb-0">進捗</h6>
                                </div>
                                <p class="small text-muted mb-1" id="progress-phase" hidden></p>
                                <div hidden class="progress" role="progressbar" aria-label="progressbar-aria" aria-valuenow="0"
                                    aria-valuemin="0" aria-valuemax="100" id="progress" style="height: 24px;">
                                    <div class="progress-bar bg-success" id="progress-bar"></div>
                                </div>
                            </div>
                        </div>

                        <div id="log-card-container">
                            <div class="card" id="log-card">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h6 class="card-title text-muted mb-0">ログ</h6>
                                        <button type="button" class="btn btn-outline-secondary btn-sm" id="log-clear-button">クリア</button>
                                    </div>
                                    <textarea readonly class="form-control font-monospace" id="output-textarea"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer border-top mt-3">
            <div class="container py-3">
                <div class="row g-2 align-items-center">
                    <div class="col-md-7">
                        <input readonly type="text" class="form-control" id="file-path"
                            aria-label="選択中の音声ファイル" placeholder="ファイルを選択してください">
                    </div>

                    <div class="col-md-2 d-grid">
                        <button type="button" class="btn btn-outline-primary" id="file-select-button">ファイル選択</button>
                    </div>

                    <div class="col-md-3 d-grid">
                        <button type="button" class="btn btn-success" id="run-ffmpeg">スタート</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="./progressbar.js"></script>
    <script src="./renderer.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
