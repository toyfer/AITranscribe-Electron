<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <script src="./theme-init.js"></script>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* フォント: BIZ UDGothic (Windows 10/11 標準搭載) */
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo UI", sans-serif;
        }
        .font-monospace {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", "Cascadia Mono", "Consolas", monospace;
        }

        /* ============================================================
           全体構成: Bootstrapのcontainer/row/col階層をフル活用
           ウィンドウサイズ追従は CSS 変数 + aspect-ratio ベースで
           実現。flex/gridのネストは使わない。
           ============================================================ */

        /* body 自身はヘッダー・メイン・フッターを縦に積むだけ */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* main は残り領域を flex で埋める */
        .app-main {
            flex: 1 1 auto;
            min-height: 0;
        }
        /* ヘッダー・フッターは内容で固定 */
        .app-header,
        .app-footer {
            flex: 0 0 auto;
        }

        /* ログカードの中身だけ flex で制御
           (Bootstrapのcol-12 > card > card-body内に閉じる) */
        .log-card-body {
            display: flex;
            flex-direction: column;
            min-height: 220px;  /* 最小サイズを確保 */
        }
        .log-card-body textarea {
            flex: 1 1 auto;
            min-height: 120px;
            resize: none;
        }
    </style>
    <title>AI文字起こし</title>
</head>

<body>
    <!-- ヘッダー: タイトル + サポーター起動ボタン -->
    <header class="app-header border-bottom">
        <div class="container py-2">
            <div class="row align-items-center g-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0 fs-3">AI文字起こし</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="./Transcribe-Suppoter/Suppoter.html">文字起こしサポーターを起動</a>
                </div>
            </div>
        </div>
    </header>

    <!-- メイン: カード3枚 (モデル選択 / 進捗 / ログ) -->
    <main class="app-main py-3">
        <div class="container">
            <div class="row g-3">
                <!-- モデル選択カード -->
                <div class="col-12">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title text-muted mb-2">モデルの選択</h6>
                            <div class="btn-group w-100" role="group" aria-label="モデル選択">
                                <input type="radio" class="btn-check" name="model" id="model-small" autocomplete="off" value="small">
                                <label class="btn btn-outline-primary" for="model-small">速度重視</label>

                                <input type="radio" class="btn-check" name="model" id="model-turbo" autocomplete="off" value="turbo" checked>
                                <label class="btn btn-outline-primary" for="model-turbo">精度重視（推奨）</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 進捗カード (タイトル + フェーズラベル + バー) -->
                <div class="col-12">
                    <div class="card progress-card">
                        <div class="card-body">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <h6 class="card-title text-muted mb-0 text-nowrap">進捗</h6>
                                <p class="small text-muted mb-0 flex-grow-1" id="progress-phase" hidden></p>
                            </div>
                            <div hidden class="progress" role="progressbar" aria-label="progressbar-aria" aria-valuenow="0"
                                aria-valuemin="0" aria-valuemax="100" id="progress" style="height: 22px;">
                                <div class="progress-bar bg-success" id="progress-bar"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- ログカード (タイトル + クリアボタン + textarea) -->
                <div class="col-12">
                    <div class="card">
                        <div class="card-body log-card-body">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h6 class="card-title text-muted mb-0">ログ</h6>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="log-clear-button">クリア</button>
                            </div>
                            <textarea readonly class="form-control font-monospace" id="output-textarea"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- フッター: ファイルパス + ファイル選択 + スタート -->
    <footer class="app-footer border-top">
        <div class="container py-3">
            <div class="row g-2 align-items-center">
                <div class="col-md-7">
                    <input readonly type="text" class="form-control" id="file-path"
                        aria-label="選択中の音声ファイル" placeholder="ファイルを選択してください">
                </div>
                <div class="col-md-2 d-grid">
                    <button type="button" class="btn btn-outline-primary" id="file-select-button">ファイル選択</button>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="button" class="btn btn-success" id="run-ffmpeg">スタート</button>
                </div>
            </div>
        </div>
    </footer>

    <script src="./progressbar.js"></script>
    <script src="./renderer.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
