<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
    <script src="./theme-init.js"></script>
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", sans-serif;
        }
        .font-monospace {
            font-family: "BIZ UDGothic", "BIZ UDPGothic", monospace;
        }
        /* 進捗カードをコンパクトに固定 */
        .progress-card .card-body {
            padding: 0.5rem 1rem;
        }
        /* ログを残り領域いっぱいに広げる */
        .log-card {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .log-card .card-body {
            flex: 1 1 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .log-card textarea {
            flex: 1 1 0;
            min-height: 60px;
            resize: none;
        }
    </style>
    <title>AI文字起こし</title>
</head>

<body class="d-flex flex-column vh-100">
    <header class="header border-bottom">
        <div class="container">
            <div class="row align-items-center py-2">
                <div class="col">
                    <h2 id="title-label" class="mb-0">AI文字起こし</h2>
                </div>
                <div class="col-auto">
                    <a class="btn btn-outline-secondary btn-sm" href="./Transcribe-Suppoter/Suppoter.html">文字起こしサポーターを起動</a>
                </div>
            </div>
        </div>
    </header>

    <main class="main flex-grow-1 d-flex flex-column overflow-hidden min-vh-0">
        <div class="container d-flex flex-column flex-grow-1 py-3 min-vh-0">
            <div class="d-flex flex-column flex-grow-1 gap-3 min-vh-0">
                <div class="card">
                    <div class="card-body py-2">
                        <h6 class="card-title text-muted mb-2">モデルの選択</h6>
                        <div class="btn-group w-100" role="group" aria-label="モデル選択">
                            <input type="radio" class="btn-check" name="model" id="model-small" autocomplete="off" value="small">
                            <label class="btn btn-outline-primary" for="model-small">速度重視</label>

                            <input type="radio" class="btn-check" name="model" id="model-turbo" autocomplete="off" value="turbo" checked>
                            <label class="btn btn-outline-primary" for="model-turbo">精度重視（推奨）</label>
                        </div>
                    </div>
                </div>

                <div class="card progress-card">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-2">
                            <h6 class="card-title text-muted mb-0 text-nowrap">進捗</h6>
                            <p class="small text-muted mb-0 flex-grow-1" id="progress-phase" hidden></p>
                        </div>
                        <div hidden class="progress mt-1" role="progressbar" aria-label="progressbar-aria" aria-valuenow="0"
                            aria-valuemin="0" aria-valuemax="100" id="progress" style="height: 20px;">
                            <div class="progress-bar bg-success" id="progress-bar"></div>
                        </div>
                    </div>
                </div>

                <div class="card log-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="card-title text-muted mb-0">ログ</h6>
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="log-clear-button">クリア</button>
                        </div>
                        <textarea readonly class="form-control font-monospace" rows="4"
                            id="output-textarea"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer border-top">
        <div class="container py-3">
            <div class="row g-2 align-items-center">
                <div class="col-md-7">
                    <input readonly type="text" class="form-control" id="file-path"
                        aria-label="選択中の音声ファイル" placeholder="ファイルを選択してください">
                </div>

                <div class="col-md-2 d-grid">
                    <button type="button" class="btn btn-outline-primary" id="file-select-button">ファイル選択</button>
                </div>

                <div class="col-md-3 d-grid">
                    <button type="button" class="btn btn-success" id="run-ffmpeg">スタート</button>
                </div>
            </div>
        </div>
    </footer>

    <script src="./progressbar.js"></script>
    <script src="./renderer.js"></script>
    <script src="./js/bootstrap.bundle.min.js"></script>
</body>

</html>
